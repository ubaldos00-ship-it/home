<!-- 소이력관리_v4.html (배포명 cattle.html) · 저장: 2026-08-20 02:46 KST -->
<!-- 소 이력·출하·판매 관리 · v3 + 사용자가 수정한 자동/API값은 파랑색 표시 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소 이력·출하·판매 관리</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --fg:#e2e8f0; --mut:#94a3b8;
    --accent:#38bdf8; --accent2:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --calc:#0b3a2e; --edit:#0b1220;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif; }
  .wrap{ max-width:1120px; margin:0 auto; padding:18px 16px 90px; }
  h1{ font-size:21px; margin:0 0 2px; }
  .sub{ color:var(--mut); font-size:13px; margin-bottom:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:16px; margin-bottom:16px; }
  .card h2{ font-size:15px; margin:0 0 12px; color:var(--accent); }
  label{ display:block; font-size:12px; color:var(--mut); margin:0 0 4px; }
  input,select{ width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line);
         background:var(--edit); color:var(--fg); font-size:16px; }
  input[readonly]{ background:#0a1a15; border-color:#14532d; color:#bbf7d0; font-weight:600; } /* API값(고정) */
  input.calc-in{ background:#131c2b; border-color:#2b3a52; color:#dbe4ef; font-weight:600; } /* 계산값(수정가능) */
  input.modified{ background:#0b2f52; border-color:#3b82f6; color:#93c5fd; font-weight:700; } /* 사용자가 수정함 */
  .grid{ display:grid; gap:10px 12px; }
  .g2{ grid-template-columns:repeat(2,1fr); }
  .g3{ grid-template-columns:repeat(3,1fr); }
  .g4{ grid-template-columns:repeat(4,1fr); }
  @media(max-width:720px){
    .g3,.g4{ grid-template-columns:repeat(2,1fr);}
    .wrap{ padding:12px 10px 80px; }
    h1{ font-size:18px; }
    .card{ padding:13px; }
    .btn{ padding:9px 14px; }
  }
  .btn{ padding:10px 18px; border:0; border-radius:8px; cursor:pointer; font-weight:700; font-size:15px; }
  .btn.pri{ background:var(--accent); color:#04263a; }
  .btn.ok{ background:var(--accent2); color:#03260f; }
  .btn.sec{ background:#334155; color:var(--fg); }
  .btn.warn{ background:transparent; color:var(--warn); border:1px solid var(--warn); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .row-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .status{ font-size:13.5px; padding:9px 12px; border-radius:8px; margin-top:10px;
           border:1px solid var(--line); background:var(--edit); display:none; }
  .hint{ font-size:11.5px; color:var(--mut); margin-top:3px; }
  .sec-title{ font-size:12px; color:var(--warn); text-transform:uppercase; letter-spacing:.04em;
              margin:14px 0 6px; border-top:1px dashed var(--line); padding-top:12px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td{ border:1px solid var(--line); padding:6px 7px; text-align:right; white-space:nowrap; }
  th{ background:var(--edit); color:var(--mut); position:sticky; top:0; }
  td.l,th.l{ text-align:left; }
  tbody tr:hover{ background:#243248; }
  .tbl-wrap{ overflow:auto; max-height:420px; border:1px solid var(--line); border-radius:8px; }
  tfoot td{ background:#0a2233; color:#bae6fd; font-weight:700; }
  .badge{ display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px;
          border:1px solid var(--line); margin:1px; }
  .mini{ padding:4px 9px; font-size:12px; border-radius:6px; }
  details summary{ cursor:pointer; color:var(--accent); font-size:13px; }
  .stat{ display:inline-block; min-width:150px; margin:2px 14px 2px 0; font-size:13px; }
  .stat b{ color:#fff; }
  /* 인쇄: 결과 카드만 */
  #printArea{ display:none; }
  @media print{
    body{ background:#fff; color:#000; }
    .wrap > *{ display:none !important; }
    #printArea{ display:block !important; }
  }
</style>

<div class="wrap">
  <h1>🐄 소 이력 · 출하 · 판매 관리 <span style="font-size:12px;color:var(--mut)">v4</span></h1>
  <div class="sub">식별번호 조회 → 자동계산 → 판매입력 → 저장. 데이터는 이 PC 브라우저(IndexedDB)에 저장됩니다.</div>

  <!-- 설정 -->
  <div class="card">
    <details>
      <summary>⚙️ 설정 (Lambda 주소 · 도체율)</summary>
      <div class="grid g2" style="margin-top:10px">
        <div>
          <label>Lambda Function URL</label>
          <input id="cfgUrl" placeholder="https://....lambda-url.ap-northeast-2.on.aws/">
        </div>
        <div>
          <label>기본 도체율 (%) · 추정생체중량 계산용</label>
          <input id="cfgRate" type="number" step="0.1" value="60">
        </div>
      </div>
      <div class="hint">여기 값은 브라우저에 저장됩니다.</div>
    </details>
  </div>

  <!-- 조회 -->
  <div class="card">
    <h2>① 조회</h2>
    <div class="grid g4">
      <div>
        <label>농장명</label>
        <input id="fFarm" list="farmList" placeholder="예: 대성농장" autocomplete="off">
        <datalist id="farmList"></datalist>
      </div>
      <div>
        <label>출하차수</label>
        <input id="fLot" placeholder="예: 2026년 8월 1차" autocomplete="off">
      </div>
      <div>
        <label>소 식별번호 (숫자만)</label>
        <input id="fTrace" inputmode="numeric" placeholder="예: 002195273067" autocomplete="off">
      </div>
      <div style="display:flex; align-items:flex-end">
        <button id="btnSearch" class="btn pri" style="width:100%">조회</button>
      </div>
    </div>
    <div style="margin-top:10px">
      <label>비고</label>
      <input id="fNote" placeholder="개체 메모 (선택)">
    </div>
    <div id="status" class="status"></div>
    <div class="hint">농장명·출하차수는 다음 소를 조회해도 유지됩니다.</div>
  </div>

  <!-- 결과 -->
  <div class="card" id="resultCard" style="display:none">
    <h2>② 조회 결과 · 자동계산</h2>

    <div class="sec-title">기본정보</div>
    <div class="grid g4">
      <div><label>식별번호</label><input id="rTrace" readonly></div>
      <div><label>품종</label><input id="rBreed" readonly></div>
      <div><label>성별</label><input id="rSex" readonly></div>
      <div><label>출생일</label><input id="rBirth" readonly></div>
    </div>

    <div class="sec-title">입식 · 사육</div>
    <div class="grid g3">
      <div>
        <label>구입일 (자동판정 · 수정가능)</label>
        <input id="rBuyDate" type="date">
        <div class="hint" id="buyHint"></div>
      </div>
      <div><label>구입개월령 (수정가능)</label><input id="rBuyMonth" type="number" step="0.1" class="calc-in"></div>
      <div><label>사육개월수 (수정가능)</label><input id="rRaiseMonth" type="number" step="0.1" class="calc-in"></div>
    </div>

    <div class="sec-title">출하 · 도축</div>
    <div class="grid g4">
      <div><label>도축일(출하일)</label><input id="rButchery" readonly></div>
      <div><label>출하개월수 (수정가능)</label><input id="rShipMonth" type="number" step="0.1" class="calc-in"></div>
      <div><label>육질등급</label><input id="rGrade" readonly></div>
      <div><label>검사결과</label><input id="rInspect" readonly></div>
    </div>
    <div class="grid g2" style="margin-top:10px">
      <div><label>도축장</label><input id="rPlace" readonly></div>
      <div><label>도축장 주소</label><input id="rPlaceAddr" readonly></div>
    </div>

    <div class="sec-title">중량</div>
    <div class="grid g3">
      <div><label>도체중량 (kg · API값, 수정가능)</label><input id="rWeight" type="number" step="0.1" class="calc-in"></div>
      <div><label>도체율 (%) · 생체중 수정시 자동역산</label><input id="rRate" type="number" step="0.1" class="calc-in"></div>
      <div><label>추정생체중량 (kg · 수정가능)</label><input id="rLive" type="number" step="0.1" class="calc-in"></div>
    </div>

    <div class="sec-title">판매</div>
    <div class="grid g4">
      <div><label>판매금액 (원)</label><input id="rSale" inputmode="numeric" placeholder="0"></div>
      <div><label>판매시비용 (원)</label><input id="rCost" inputmode="numeric" placeholder="0"></div>
      <div><label>실판매금액 (원)</label><input id="rNet" readonly></div>
      <div><label>kg당 실판매단가 (원/kg)</label><input id="rUnit" readonly></div>
    </div>

    <div class="row-actions">
      <button id="btnSave" class="btn ok">저장</button>
      <button id="btnPrint" class="btn sec">인쇄</button>
      <button id="btnNext" class="btn sec">다음 소 조회</button>
    </div>
  </div>

  <!-- 저장 목록 -->
  <div class="card">
    <h2>③ 저장 목록 <span id="listCount" style="color:var(--mut);font-size:12px"></span></h2>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px">
      <input id="fSearch" placeholder="🔍 검색 (농장명·출하차수·식별번호·등급)" style="flex:1; min-width:200px">
      <button id="btnXlsxAll" class="btn ok mini">엑셀(전체)</button>
      <button id="btnXlsxFilter" class="btn ok mini">엑셀(검색결과)</button>
      <button id="btnBackup" class="btn sec mini">백업(JSON)</button>
      <button id="btnRestore" class="btn sec mini">복원</button>
      <input id="fileRestore" type="file" accept="application/json,.json" style="display:none">
    </div>
    <div class="tbl-wrap">
      <table id="listTbl">
        <thead><tr>
          <th class="l">농장명</th><th class="l">출하차수</th><th class="l">식별번호</th>
          <th>출생일</th><th>구입일</th><th>구입<br>개월</th><th>사육<br>개월</th><th>출하<br>개월</th>
          <th>도체<br>중량</th><th>추정<br>생체중</th><th>등급</th>
          <th>판매금액</th><th>판매비용</th><th>실판매액</th><th>kg단가</th><th class="l">비고</th><th>관리</th>
        </tr></thead>
        <tbody id="listBody"></tbody>
        <tfoot id="listFoot"></tfoot>
      </table>
    </div>
    <div id="statBox" style="margin-top:12px"></div>
  </div>
</div>

<!-- 인쇄영역 -->
<div id="printArea"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const DEFAULT_URL = "https://r2vnmzx2rnwirfazkzvugdyqne0vljcr.lambda-url.ap-northeast-2.on.aws/";
const LS = { url:"cattle_url", rate:"cattle_rate", lot:"cattle_lot", farms:"cattle_farms" };

/* localStorage 안전 래퍼 (file://·data: 등 저장 차단 환경에서도 메모리로 폴백) */
const _mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in _mem)?_mem[k]:null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ _mem[k]=v; } }
};

/* ---------- 설정 로드 ---------- */
$("cfgUrl").value = store.get(LS.url) || DEFAULT_URL;
$("cfgRate").value = store.get(LS.rate) || "60";
$("fLot").value = store.get(LS.lot) || "";
$("cfgUrl").onchange = () => store.set(LS.url, $("cfgUrl").value.trim());
$("cfgRate").onchange = () => store.set(LS.rate, $("cfgRate").value);
$("fLot").onchange = () => store.set(LS.lot, $("fLot").value.trim());

function loadFarms(){
  const arr = JSON.parse(store.get(LS.farms) || "[]");
  $("farmList").innerHTML = arr.map(f=>`<option value="${escAttr(f)}">`).join("");
}
function rememberFarm(name){
  name = (name||"").trim(); if(!name) return;
  let arr = JSON.parse(store.get(LS.farms) || "[]");
  if(!arr.includes(name)){ arr.push(name); store.set(LS.farms, JSON.stringify(arr)); loadFarms(); }
}
loadFarms();

/* ---------- 유틸 ---------- */
function escAttr(s){ return String(s).replace(/"/g,"&quot;"); }
function escHtml(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function parseYmd(s){ // 'YYYYMMDD' -> Date or null
  if(!s || !/^\d{8}$/.test(s)) return null;
  const y=+s.slice(0,4), m=+s.slice(4,6), d=+s.slice(6,8);
  const dt=new Date(y, m-1, d); return isNaN(dt)?null:dt;
}
function ymdDash(s){ return (s && /^\d{8}$/.test(s)) ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}` : (s||""); }
function dateToInput(dt){ if(!dt) return ""; const z=n=>String(n).padStart(2,"0"); return `${dt.getFullYear()}-${z(dt.getMonth()+1)}-${z(dt.getDate())}`; }
function inputToDate(v){ if(!v) return null; const dt=new Date(v+"T00:00:00"); return isNaN(dt)?null:dt; }
function monthsBetween(a,b){ // 소수 (연·월 차이 + 잔여일/해당월일수)
  if(!a||!b) return null;
  let months = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  const dayDiff = b.getDate()-a.getDate();
  const dim = new Date(b.getFullYear(), b.getMonth(), 0).getDate(); // 직전 달 일수
  months += dayDiff/dim;
  return months;
}
const r1 = n => (n==null||isNaN(n)) ? "" : (Math.round(n*10)/10).toFixed(1);
const won = n => (n==null||isNaN(n)) ? "" : Math.round(n).toLocaleString("ko-KR");
const onlyNum = s => String(s).replace(/[^\d.-]/g,"");
const onlyInt = s => String(s).replace(/[^\d]/g,"");

/* ---------- 조회 ---------- */
let CUR = null;      // 현재 개체 원본 데이터
let EDITING = false; // 목록 [수정]으로 불러온 상태

function setStatus(html, kind){
  const el=$("status"); el.style.display="block"; el.innerHTML=html;
  el.style.borderColor = kind==="bad"?"var(--bad)":kind==="ok"?"var(--accent2)":kind==="warn"?"var(--warn)":"var(--line)";
}

$("btnSearch").onclick = doSearch;
$("fTrace").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });

async function doSearch(){
  const base = $("cfgUrl").value.trim().replace(/\/+$/,"");
  const traceNo = onlyInt($("fTrace").value);
  if(!base){ setStatus("❌ 설정에서 Lambda URL을 먼저 입력하세요.","bad"); return; }
  if(traceNo.length<9||traceNo.length>15){ setStatus("❌ 식별번호는 숫자 9~15자리여야 합니다.","bad"); return; }
  store.set(LS.url, base);

  $("btnSearch").disabled=true; setStatus("⏳ 조회 중…");
  let data;
  try{
    const res = await fetch(`${base}/?traceNo=${traceNo}&all=1`);
    data = await res.json();
  }catch(e){ setStatus("❌ AWS 통신 오류: "+escHtml(e.message||e),"bad"); $("btnSearch").disabled=false; return; }
  finally{ $("btnSearch").disabled=false; }

  if(!data.ok){ setStatus(`❌ ${escHtml(data.error||"오류")}: ${escHtml(data.message||"")}`,"bad"); return; }

  const byOpt = {}; (data.results||[]).forEach(r=> byOpt[r.optionNo]=r );
  const o1 = byOpt[1]?.items?.[0];
  const o2items = byOpt[2]?.items || [];
  const o3 = byOpt[3]?.items?.[0];

  if(!o1){ setStatus("⚠️ 개체 기본정보가 없습니다. 식별번호를 확인하세요.","warn"); return; }

  // 구입일 자동판정: 도축출하 이전 마지막 '양수' regYmd
  const butcheryYmd = o3?.butcheryYmd || null;
  const yangsu = o2items.filter(x=>x.regType==="양수" && /^\d{8}$/.test(x.regYmd))
                        .filter(x=> !butcheryYmd || x.regYmd <= butcheryYmd)
                        .map(x=>x.regYmd).sort();
  const autoBuy = yangsu.length ? yangsu[yangsu.length-1] : null;

  CUR = {
    traceNo,
    birthYmd: o1.birthYmd, breed: o1.lsTypeNm, sex: o1.sexNm,
    butcheryYmd, place: o3?.butcheryPlaceNm||"", placeAddr: o3?.butcheryPlaceAddr||"",
    grade: o3?.gradeNm||"", inspect: o3?.inspectPassYn||"",
    weight: o3?.weight? Number(o3.weight): null,
    autoBuy, move:o2items,
  };
  EDITING=false; $("btnSave").textContent="저장";
  fillForm();
  const msgs=[];
  if(!o3){ msgs.push("도축정보 없음(도축 전 개체) → 도체중량 직접 입력"); }
  else if(CUR.weight==null){ msgs.push("도체중량 미제공 → 직접 입력"); }
  if(!autoBuy){ msgs.push("구입(양수) 이력 없음 → 구입일 직접 입력"); }
  setStatus(`✅ 조회 완료 · ${escHtml(CUR.breed)} ${escHtml(CUR.sex)}` + (msgs.length?` · ⚠️ ${msgs.join(" / ")}`:""), msgs.length?"warn":"ok");
}

function fillForm(){
  $("resultCard").style.display="block";
  $("rTrace").value = CUR.traceNo;
  $("rBreed").value = CUR.breed||"";
  $("rSex").value = CUR.sex||"";
  $("rBirth").value = ymdDash(CUR.birthYmd);
  $("rButchery").value = ymdDash(CUR.butcheryYmd);
  $("rGrade").value = CUR.grade||"";
  $("rInspect").value = CUR.inspect||"";
  $("rPlace").value = CUR.place||"";
  $("rPlaceAddr").value = CUR.placeAddr||"";
  $("rBuyDate").value = CUR.autoBuy ? dateToInput(parseYmd(CUR.autoBuy)) : "";
  $("buyHint").textContent = CUR.autoBuy ? `자동판정: ${ymdDash(CUR.autoBuy)} (도축 이전 마지막 양수일)` : "자동판정 불가 — 직접 입력";
  $("rWeight").value = CUR.weight!=null ? CUR.weight : "";
  $("rRate").value = $("cfgRate").value || "60";
  $("rSale").value=""; $("rCost").value="";
  recalc();
  clearMods(); // 새 조회 = 수정 없음(모두 자동/API값)
  $("resultCard").scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------- 수정표시(파랑) ---------- */
// 사용자가 직접 값을 바꾼 자동/API 필드를 파랑으로 표시
const AUTO_FIELDS = ["rBuyDate","rWeight","rRate","rLive","rBuyMonth","rRaiseMonth","rShipMonth"];
const markMod   = id => $(id).classList.add("modified");
const unmark    = id => $(id).classList.remove("modified");
const clearMods = () => AUTO_FIELDS.forEach(unmark);
AUTO_FIELDS.forEach(id=> $(id).addEventListener("input", ()=> markMod(id)));

/* ---------- 자동계산 ---------- */
// 구입일 변경 → 개월수 3개 재계산(덮어쓰기, 자동값이므로 파랑 해제). 개월수 칸은 이후 수동 수정 가능.
$("rBuyDate").addEventListener("input", ()=>{ recalcMonths(); ["rBuyMonth","rRaiseMonth","rShipMonth"].forEach(unmark); });
// 도체중량 변경 → 도체율 유지하며 생체중 재계산(자동값) + 단가 재계산
$("rWeight").addEventListener("input", ()=>{ recalcLiveFromRate(); unmark("rLive"); recalcMoney(); });
// 도체율 변경 → 생체중 재계산(자동값)
$("rRate").addEventListener("input", ()=>{ recalcLiveFromRate(); unmark("rLive"); });
// 추정생체중 수동 변경 → 도체율 역산(자동값)
$("rLive").addEventListener("input", ()=>{ recalcRateFromLive(); unmark("rRate"); });
// 판매금액/비용 → 천단위 포맷 + 실판매/단가 재계산
["rSale","rCost"].forEach(id=> $(id).addEventListener("input", e=>{
  e.target.value = e.target.value ? Number(onlyInt(e.target.value)).toLocaleString("ko-KR"):"";
  recalcMoney();
}));

function recalcMonths(){
  const birth = parseYmd(CUR?.birthYmd);
  const buy = inputToDate($("rBuyDate").value);
  const but = parseYmd(CUR?.butcheryYmd);
  $("rBuyMonth").value   = r1(monthsBetween(birth, buy));
  $("rRaiseMonth").value = r1(monthsBetween(buy, but));
  $("rShipMonth").value  = r1(monthsBetween(birth, but));
}
function recalcLiveFromRate(){ // 도체중량 & 도체율 → 추정생체중
  const w = Number($("rWeight").value)||0, rate = Number($("rRate").value)||0;
  $("rLive").value = (w>0 && rate>0) ? r1(w/(rate/100)) : "";
}
function recalcRateFromLive(){ // 도체중량 & 추정생체중 → 도체율(역산)
  const w = Number($("rWeight").value)||0, live = Number($("rLive").value)||0;
  $("rRate").value = (w>0 && live>0) ? r1(w/live*100) : "";
}
function recalcMoney(){
  const w = Number($("rWeight").value)||0;
  const sale = Number(onlyInt($("rSale").value))||0;
  const cost = Number(onlyInt($("rCost").value))||0;
  const net = sale - cost;
  $("rNet").value = sale? won(net) : "";
  $("rUnit").value = (net && w>0) ? won(net/w) : "";
}
function recalc(){ recalcMonths(); recalcLiveFromRate(); recalcMoney(); }

/* ---------- IndexedDB (차단 환경에서는 메모리 폴백) ---------- */
let DB=null, MEM=null; // MEM 활성 시 = 저장이 유지되지 않는 임시 모드
function openDB(){
  return new Promise((res)=>{
    let rq;
    try{ rq = indexedDB.open("cattleDB", 1); }
    catch(e){ MEM=new Map(); return res(); }
    rq.onupgradeneeded = e=>{ const db=e.target.result;
      if(!db.objectStoreNames.contains("records")) db.createObjectStore("records",{keyPath:"traceNo"}); };
    rq.onsuccess = e=>{ DB=e.target.result; res(); };
    rq.onerror = ()=>{ MEM=new Map(); res(); };
  });
}
function tx(mode){ return DB.transaction("records",mode).objectStore("records"); }
function putRec(rec){ if(MEM){ MEM.set(rec.traceNo,rec); return Promise.resolve(); }
  return new Promise((res,rej)=>{ const r=tx("readwrite").put(rec); r.onsuccess=res; r.onerror=e=>rej(e.target.error); }); }
function getRec(k){ if(MEM){ return Promise.resolve(MEM.get(k)); }
  return new Promise((res,rej)=>{ const r=tx("readonly").get(k); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error); }); }
function delRec(k){ if(MEM){ MEM.delete(k); return Promise.resolve(); }
  return new Promise((res,rej)=>{ const r=tx("readwrite").delete(k); r.onsuccess=res; r.onerror=e=>rej(e.target.error); }); }
function allRecs(){ if(MEM){ return Promise.resolve([...MEM.values()]); }
  return new Promise((res,rej)=>{ const r=tx("readonly").getAll(); r.onsuccess=e=>res(e.target.result||[]); r.onerror=e=>rej(e.target.error); }); }

    raiseMonth: parseFloat($("rRaiseMonth").value)||null,

    salePrice: Number(onlyInt($("rSale").value))||0,

async function loadForEdit(key){
  const r = await getRec(key);
  if(!r){ setStatus("수정할 자료를 찾지 못했습니다.","bad"); return; }
  CUR = {
    traceNo:r.traceNo, birthYmd:r.birthYmd, breed:r.breed, sex:r.sex,
    butcheryYmd:r.butcheryYmd, place:r.place, placeAddr:r.placeAddr,
    grade:r.grade, inspect:r.inspect, weight:r.weight, autoBuy:r.autoBuy,
  };
  fillForm();
  // 저장돼 있던 사용자 입력값으로 덮어쓰기
  $("fFarm").value = r.farm||""; $("fLot").value = r.lot||""; $("fNote").value = r.note||"";
  if(r.buyDate) $("rBuyDate").value = r.buyDate;
  if(r.dressRate) $("rRate").value = r.dressRate;
  $("rSale").value = r.salePrice ? Number(r.salePrice).toLocaleString("ko-KR") : "";
  $("rCost").value = r.saleCost ? Number(r.saleCost).toLocaleString("ko-KR") : "";
  recalc();
  // 현재 buyDate/도체중량/도체율 기준 자동 baseline 캡처
  const baseVals = {}; AUTO_FIELDS.forEach(id=> baseVals[id]=$(id).value);
  // 저장된(수동 수정 포함) 값 그대로 복원 — 자동계산으로 덮어쓰지 않음
  if(r.buyMonth!=null)   $("rBuyMonth").value   = r1(r.buyMonth);
  if(r.raiseMonth!=null) $("rRaiseMonth").value = r1(r.raiseMonth);
  if(r.shipMonth!=null)  $("rShipMonth").value  = r1(r.shipMonth);
  if(r.dressRate!=null)  $("rRate").value        = r1(r.dressRate);
  if(r.liveWeight!=null) $("rLive").value        = r1(r.liveWeight);
  // 파랑 표시: 저장값이 자동 baseline과 다르면 사용자가 수정한 것
  clearMods();
  AUTO_FIELDS.forEach(id=>{ if($(id).value!==baseVals[id]) markMod(id); });
  if(r.buyDate && CUR.autoBuy && r.buyDate!==dateToInput(parseYmd(CUR.autoBuy))) markMod("rBuyDate");
  EDITING = true; $("btnSave").textContent = "수정 저장";
  setStatus(`✏️ 수정 모드 · ${escHtml(r.farm||"")} · ${r.traceNo} (저장 시 갱신됩니다)`,"warn");
}

let ALL_RECS = [];
async function refreshList(){
  ALL_RECS = await allRecs();
  ALL_RECS.sort((a,b)=> (a.lot||"").localeCompare(b.lot||"") || (a.savedAt||"").localeCompare(b.savedAt||""));
  applyFilter();
}
let FILTERED = [];
function applyFilter(){
  const q = ($("fSearch").value||"").trim().toLowerCase();
  const recs = q ? ALL_RECS.filter(r=>
    [r.farm,r.lot,r.traceNo,r.grade].some(v=>String(v||"").toLowerCase().includes(q))) : ALL_RECS;
  FILTERED = recs;
  $("listCount").textContent = `(${recs.length}두${q?` / 전체 ${ALL_RECS.length}`:""})`;
  $("listBody").innerHTML = recs.map(r=>rowHtml(r)).join("") ||
    `<tr><td class="l" colspan="17" style="color:var(--mut)">${q?"검색 결과 없음":"저장된 개체가 없습니다."}</td></tr>`;
  $("listBody").querySelectorAll("[data-del]").forEach(b=> b.onclick=async()=>{
    if(confirm(`${b.dataset.del} 삭제할까요?`)){ await delRec(b.dataset.del); refreshList(); }
  });
  $("listBody").querySelectorAll("[data-edit]").forEach(b=> b.onclick=()=> loadForEdit(b.dataset.edit));
  renderFoot(recs); renderStats(recs);
}

const avg=(a)=> a.length? a.reduce((s,x)=>s+x,0)/a.length : null;
const sum=(a)=> a.reduce((s,x)=>s+x,0);
function renderFoot(recs){
  if(!recs.length){ $("listFoot").innerHTML=""; return; }
  const w=recs.map(r=>r.weight||0), lw=recs.map(r=>r.liveWeight||0);
  const sp=recs.map(r=>r.salePrice||0), sc=recs.map(r=>r.saleCost||0), ns=recs.map(r=>r.netSale||0);
  $("listFoot").innerHTML = `
   <tr><td class="l" colspan="8">합계 (${recs.length}두)</td>
     <td>${r1(sum(w))}</td><td>${r1(sum(lw))}</td><td></td>
     <td>${won(sum(sp))}</td><td>${won(sum(sc))}</td><td>${won(sum(ns))}</td><td></td><td class="l"></td><td></td></tr>
   <tr><td class="l" colspan="5">평균</td>
     <td>${r1(avg(recs.map(r=>r.buyMonth).filter(v=>v!=null)))}</td>
     <td>${r1(avg(recs.map(r=>r.raiseMonth).filter(v=>v!=null)))}</td>
     <td>${r1(avg(recs.map(r=>r.shipMonth).filter(v=>v!=null)))}</td>
     <td>${r1(avg(w.filter(v=>v)))}</td><td>${r1(avg(lw.filter(v=>v)))}</td><td></td>
     <td>${won(avg(sp))}</td><td>${won(avg(sc))}</td><td>${won(avg(ns))}</td>
     <td>${won(avg(recs.map(r=>r.unitPrice).filter(v=>v!=null)))}</td><td class="l"></td><td></td></tr>`;
}
function renderStats(recs){
  if(!recs.length){ $("statBox").innerHTML=""; return; }
  const n=recs.length;
  const grades={}; recs.forEach(r=>{ const g=r.grade||"기타"; grades[g]=(grades[g]||0)+1; });
  const order=["1++","1+","1","2","3"];
  const keys=[...order.filter(k=>grades[k]), ...Object.keys(grades).filter(k=>!order.includes(k))];
  const above1 = (grades["1++"]||0)+(grades["1+"]||0)+(grades["1"]||0);
  const gradeHtml = keys.map(k=>`<span class="badge">${escHtml(k)}: ${grades[k]}두 (${(grades[k]/n*100).toFixed(0)}%)</span>`).join(" ");
  $("statBox").innerHTML = `
    <div style="border-top:1px dashed var(--line); padding-top:10px">
      <div style="margin-bottom:6px">
        <span class="stat">출하두수 <b>${n}두</b></span>
        <span class="stat">평균 도체중 <b>${r1(avg(recs.map(r=>r.weight||0).filter(v=>v)))}kg</b></span>
        <span class="stat">평균 추정생체중 <b>${r1(avg(recs.map(r=>r.liveWeight||0).filter(v=>v)))}kg</b></span>
        <span class="stat">두당 평균 실판매 <b>${won(avg(recs.map(r=>r.netSale||0)))}원</b></span>
        <span class="stat">평균 kg단가 <b>${won(avg(recs.map(r=>r.unitPrice).filter(v=>v!=null)))}원</b></span>
      </div>
      <div style="font-size:12px;color:var(--mut);margin-bottom:4px">육질등급 분포</div>
      <div>${gradeHtml} <span class="badge" style="border-color:var(--accent2);color:#bbf7d0">1등급이상 ${above1}두 (${(above1/n*100).toFixed(0)}%)</span></div>
    </div>`;
}

/* ---------- Excel 다운로드 ---------- */
const XLSX_HEADER = ["농장명","출하차수","식별번호","품종","성별","출생일","구입일","도축일",
  "구입개월령","사육개월수","출하개월수","도체중량","도체율","추정생체중량","육질등급","검사결과",
  "도축장","판매금액","판매시비용","실판매금액","kg당단가","비고","조회일"];
function recToArr(r){
  return [ r.farm||"", r.lot||"", r.traceNo||"", r.breed||"", r.sex||"",
    ymdDash(r.birthYmd), r.buyDate||"", ymdDash(r.butcheryYmd),
    r.buyMonth??"", r.raiseMonth??"", r.shipMonth??"",
    r.weight??"", r.dressRate??"", r.liveWeight??"", r.grade||"", r.inspect||"",
    r.place||"", r.salePrice??0, r.saleCost??0, r.netSale??0, r.unitPrice??"",
    r.note||"", (r.savedAt||"").slice(0,10) ];
}
function buildAOA(recs){
  const aoa = [XLSX_HEADER, ...recs.map(recToArr)];
  const s=a=>a.reduce((x,y)=>x+(Number(y)||0),0);
  const a=(arr)=>{ const v=arr.map(x=>Number(x)).filter(x=>!isNaN(x)); return v.length? Math.round(v.reduce((p,q)=>p+q,0)/v.length*10)/10 : ""; };
  const col=k=>recs.map(r=>r[k]);
  aoa.push([]);
  aoa.push(["합계",`${recs.length}두`,"","","","","","","","","",
    Math.round(s(col("weight"))*10)/10, "", Math.round(s(col("liveWeight"))*10)/10, "","","",
    s(col("salePrice")), s(col("saleCost")), s(col("netSale")), "","",""]);
  aoa.push(["평균","","","","","","","",
    a(col("buyMonth")), a(col("raiseMonth")), a(col("shipMonth")),
    a(col("weight")), a(col("dressRate")), a(col("liveWeight")),"","","",
    Math.round(a(col("salePrice"))), Math.round(a(col("saleCost"))), Math.round(a(col("netSale"))),
    Math.round(a(col("unitPrice")))||"","",""]);
  return aoa;
}
function lazyXLSX(){
  return new Promise((res,rej)=>{
    if(window.XLSX) return res(window.XLSX);
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload=()=> window.XLSX ? res(window.XLSX) : rej(new Error("XLSX 미로드"));
    s.onerror=()=> rej(new Error("CDN 접속 실패(오프라인?)"));
    document.head.appendChild(s);
  });
}
function dlBlob(blob, fname){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function csvFallback(aoa, base){
  const esc=v=>{ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv="﻿"+aoa.map(row=>row.map(esc).join(",")).join("\r\n");
  dlBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}), base+".csv");
}
async function exportExcel(recs, suffix){
  if(!recs.length){ setStatus("내보낼 자료가 없습니다.","warn"); return; }
  const z=n=>String(n).padStart(2,"0"); const d=new Date();
  const base=`소이력관리_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}${suffix?"_"+suffix:""}`;
  const aoa=buildAOA(recs);
  try{
    const X=await lazyXLSX();
    const ws=X.utils.aoa_to_sheet(aoa);
    ws["!cols"]=XLSX_HEADER.map(h=>({wch: Math.max(8, h.length*2)}));
    const wb=X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "소이력");
    X.writeFile(wb, base+".xlsx");
    setStatus(`⬇️ 엑셀 저장: ${base}.xlsx (${recs.length}두)`,"ok");
  }catch(e){
    csvFallback(aoa, base);
    setStatus(`⬇️ CSV로 저장: ${base}.csv (엑셀 라이브러리 미로드: ${escHtml(e.message||e)})`,"warn");
  }
}
$("btnXlsxAll").onclick   = ()=> exportExcel(ALL_RECS, "");
$("btnXlsxFilter").onclick= ()=> exportExcel(FILTERED, "검색결과");
