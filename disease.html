<!-- disease.html (v1) · 저장: 2026-08-26 04:47 KST -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>가축질병 현장정보</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --line:#e5e7eb; --line2:#d1d5db;
    --t1:#1f2937; --t2:#6b7280; --t3:#9ca3af;
    --accent:#1d6fe0; --accent-bg:#e8f1fd;
    --warn:#b45309; --warn-bg:#fef3e2;
    --red:#d85a30; --amber:#ba7517; --gray:#9ca3af;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--t1);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16px; line-height:1.5; overflow-x:hidden;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 14px 40px;}
  header{
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding:14px 0 8px; border-bottom:1px solid var(--line);
  }
  .h-title{font-size:19px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .h-time{font-size:12px; color:var(--t3); margin-top:2px;}
  .search-box{display:flex; gap:6px; margin-top:10px;}
  .search-box input{
    flex:1; height:46px; border:1px solid var(--line2); border-radius:12px;
    padding:0 14px; font-size:16px; background:var(--card); color:var(--t1);
  }
  .search-box button{
    width:52px; border:none; border-radius:12px; background:var(--accent);
    color:#fff; font-size:20px; font-weight:600;
  }
  .period{display:flex; gap:6px; margin:12px 0 4px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .period button{
    flex:0 0 auto; height:34px; padding:0 14px; border:1px solid var(--line2);
    background:var(--card); border-radius:20px; font-size:14px; color:var(--t2);
  }
  .period button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .summary{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0;}
  .stat{background:var(--card); border-radius:12px; padding:12px 4px; text-align:center; border:1px solid var(--line);}
  .stat .n{font-size:24px; font-weight:700;}
  .stat .l{font-size:12px; color:var(--t2); margin-top:1px;}
  .sec-label{font-size:13px; color:var(--t2); margin:16px 2px 8px; font-weight:600;}
  .card{
    background:var(--card); border:1px solid var(--line); border-left-width:4px;
    border-radius:10px; padding:11px 13px; margin-bottom:8px;
  }
  .card .loc{font-size:16px; font-weight:700; line-height:1.35;}
  .card .dis{font-size:14px; color:var(--accent); margin-top:2px; font-weight:600;}
  .card .meta{font-size:13px; color:var(--t2); margin-top:3px;}
  .card .meta .sep{color:var(--line2); margin:0 5px;}
  .btn-row{display:flex; gap:8px; margin-top:12px;}
  .btn{
    flex:1; text-align:center; padding:13px; border:1px solid var(--line2);
    background:var(--card); border-radius:12px; font-size:15px; font-weight:600; color:var(--t1);
  }
  .btn-more{width:100%; text-align:center; padding:13px; border:1px dashed var(--line2);
    background:transparent; border-radius:12px; font-size:14px; color:var(--t2); margin-top:4px;}
  .banner-none{background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:12px 14px; font-size:14px; font-weight:600; margin-bottom:10px;}
  .banner-ok{background:var(--accent-bg); color:var(--accent); border-radius:10px; padding:12px 14px; font-size:14px; font-weight:600; margin-bottom:10px;}
  .back{display:inline-flex; align-items:center; gap:5px; font-size:14px; color:var(--t2); padding:10px 0; background:none; border:none;}
  .region-item{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:13px; margin-bottom:7px; font-size:15px; display:flex; justify-content:space-between; align-items:center;}
  .region-item .chev{color:var(--t3);}
  .empty{text-align:center; color:var(--t3); padding:36px 12px; font-size:15px;}
  .loading{text-align:center; color:var(--t2); padding:30px; font-size:15px;}
  .yr{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px;}
  .yr .y{font-size:16px; font-weight:700;}
  .yr .d{font-size:14px; color:var(--t2); margin-top:2px;}
  .hidden{display:none;}
  .subttl{font-size:15px; font-weight:700; margin:4px 0 10px; padding:11px 13px; background:var(--card); border:1px solid var(--line); border-radius:10px;}
  .note{font-size:12px; color:var(--t3); text-align:center; margin-top:18px; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="h-title">🐾 가축질병 현장정보</div>
    <div class="h-time" id="dataTime">데이터 확인 중…</div>
    <div class="search-box">
      <input id="q" type="search" inputmode="search" placeholder="방문지역 검색 (예: 영천, 봉황면)" autocomplete="off">
      <button id="btnSearch" aria-label="검색">🔍</button>
    </div>
  </header>

  <!-- ===== 홈 ===== -->
  <section id="viewHome">
    <div class="period" id="period">
      <button data-d="7">최근 7일</button>
      <button data-d="30">1개월</button>
      <button data-d="90" class="on">3개월</button>
      <button data-d="180">6개월</button>
      <button data-d="365">1년</button>
    </div>
    <div class="summary">
      <div class="stat"><div class="n" id="sRegion">–</div><div class="l">발생지역</div></div>
      <div class="stat"><div class="n" id="sCase">–</div><div class="l">발생건수</div></div>
      <div class="stat"><div class="n" id="s7">–</div><div class="l">최근 7일</div></div>
    </div>
    <div class="sec-label" id="homeLabel">최근 발생지역 · 최신순</div>
    <div id="homeList"></div>
    <div class="btn-row">
      <button class="btn" id="btnAll">전체보기</button>
      <button class="btn" id="btnHistHome">과거자료</button>
    </div>
    <div class="note">
      본 정보는 농림축산검역본부 공개데이터 기준이며 방역 판단 자료가 아닙니다.<br>
      최종 방문 여부는 소속기관 지침에 따르세요.
    </div>
  </section>

  <!-- ===== 지역 후보 목록 ===== -->
  <section id="viewSearch" class="hidden">
    <button class="back" onclick="goHome()">← 홈</button>
    <div class="sec-label" id="searchLabel">지역 검색 결과</div>
    <div id="searchList"></div>
  </section>

  <!-- ===== 지역 드릴다운(확대) ===== -->
  <section id="viewArea" class="hidden">
    <button class="back" onclick="goHome()">← 홈</button>
    <div class="subttl" id="areaTitle"></div>
    <div id="areaBody"></div>
    <button class="btn-more" id="btnAreaHist">이 지역 과거자료 보기</button>
  </section>

  <!-- ===== 과거자료 ===== -->
  <section id="viewHist" class="hidden">
    <button class="back" onclick="goHome()">← 홈</button>
    <div class="subttl" id="histTitle"></div>
    <div id="histBody"></div>
  </section>

</div>

<script>
const RELAY = "https://induowdrembd3zhtym3ke6prcy0cgajf.lambda-url.ap-northeast-2.on.aws/";
let curDays = 90;
let curArea = null; // {code, loc}

// ── 유틸 ──────────────────────────────
function el(id){return document.getElementById(id);}
function show(view){
  ["viewHome","viewSearch","viewArea","viewHist"].forEach(v=>el(v).classList.add("hidden"));
  el(view).classList.remove("hidden");
  window.scrollTo(0,0);
}
function goHome(){ show("viewHome"); }

function fmtOcc(s){ // "20260813" → "26.08.13"
  if(!s || s.length<8) return s||"";
  return s.slice(2,4)+"."+s.slice(4,6)+"."+s.slice(6,8);
}
function fmtCess(s){
  if(!s) return "종식일 미등록";
  if(s.length<8) return "종식일 미등록";
  return "종식 "+s.slice(2,4)+"."+s.slice(4,6)+"."+s.slice(6,8);
}
function fmtTime(iso){ // ISO(UTC) → KST "MM.DD HH:mm"
  try{
    const d=new Date(iso); const k=new Date(d.getTime()+9*3600000);
    const p=n=>String(n).padStart(2,"0");
    return p(k.getUTCMonth()+1)+"."+p(k.getUTCDate())+" "+p(k.getUTCHours())+":"+p(k.getUTCMinutes());
  }catch(e){ return ""; }
}
function diseaseColor(name){
  if(/ASF|아프리카|돼지열병/.test(name)) return "var(--red)";
  if(/AI|인플루엔자|뉴캣슬/.test(name)) return "var(--amber)";
  if(/럼피|구제역/.test(name)) return "var(--accent)";
  return "var(--gray)";
}
function cardHTML(x){
  return `<div class="card" style="border-left-color:${diseaseColor(x.disease)}">
    <div class="loc">${x.loc||"-"}</div>
    <div class="dis">${x.disease||"-"} · ${x.species||"-"}</div>
    <div class="meta">${fmtOcc(x.occDe)} 발생<span class="sep">|</span>${x.count?x.count.toLocaleString()+"마리":"두수 미상"}<span class="sep">|</span>${fmtCess(x.cessDe)}</div>
  </div>`;
}
async function api(params){
  const url = RELAY + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}

// ── 홈: 최근현황 ──────────────────────
async function loadHome(){
  el("homeList").innerHTML = '<div class="loading">불러오는 중…</div>';
  el("sRegion").textContent="–"; el("sCase").textContent="–"; el("s7").textContent="–";
  try{
    const d = await api({mode:"recent", days:curDays, limit:8});
    if(!d.ok) throw new Error(d.message||"오류");
    el("dataTime").textContent = "데이터 확인 "+fmtTime(d.fetchedAt);
    el("sRegion").textContent = d.summary.regionCount;
    el("sCase").textContent = d.summary.caseCount;
    el("s7").textContent = d.summary.last7d;
    if(!d.items.length){
      el("homeList").innerHTML = '<div class="empty">해당 기간 발생 없음</div>';
    }else{
      el("homeList").innerHTML = d.items.map(cardHTML).join("");
    }
  }catch(e){
    el("homeList").innerHTML = '<div class="empty">현재 가축질병 정보를 불러오지<br>못했습니다. 잠시 후 다시 확인해 주세요.</div>';
    el("dataTime").textContent = "데이터 확인 실패";
  }
}

// ── 기간 버튼 ─────────────────────────
el("period").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  curDays = Number(b.dataset.d);
  [...el("period").children].forEach(x=>x.classList.toggle("on", x===b));
  const lbl={7:"최근 7일",30:"최근 1개월",90:"최근 3개월",180:"최근 6개월",365:"최근 1년"}[curDays];
  el("homeLabel").textContent = lbl+" 발생지역 · 최신순";
  loadHome();
});

// ── 지역 검색 ─────────────────────────
async function doSearch(){
  const kw = el("q").value.trim();
  if(kw.length<2){ alert("두 글자 이상 입력하세요."); return; }
  show("viewSearch");
  el("searchLabel").textContent = `"${kw}" 검색 결과`;
  el("searchList").innerHTML = '<div class="loading">검색 중…</div>';
  try{
    const d = await api({mode:"search", q:kw});
    if(!d.ok) throw new Error(d.message);
    if(!d.regions.length){
      el("searchList").innerHTML = '<div class="empty">일치하는 지역이 없습니다.<br>시·군·읍·면·리 이름으로 검색해 보세요.</div>';
      return;
    }
    el("searchList").innerHTML = d.regions.map(r=>
      `<div class="region-item" onclick='openArea(${JSON.stringify(r).replace(/'/g,"&#39;")})'>
         <span>${r.loc}</span><span class="chev">›</span></div>`).join("");
  }catch(e){
    el("searchList").innerHTML = '<div class="empty">검색에 실패했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
  }
}
el("btnSearch").addEventListener("click", doSearch);
el("q").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });

// ── 지역 드릴다운(확대) ────────────────
async function openArea(r){
  curArea = r;
  show("viewArea");
  el("areaTitle").textContent = r.loc;
  el("areaBody").innerHTML = '<div class="loading">불러오는 중…</div>';
  try{
    const d = await api({mode:"area", code:r.code, days:curDays});
    if(!d.ok) throw new Error(d.message);
    let html="";
    // 해당 리
    if(d.ri.count>0){
      html += `<div class="banner-ok">해당 리 · 최근 발생 ${d.ri.count}건</div>` + d.ri.items.map(cardHTML).join("");
    }else{
      html += `<div class="banner-none">해당 리 · 최근 발생 없음</div>`;
    }
    // 같은 읍면동
    html += `<div class="sec-label">같은 읍·면·동 <b>${d.emd.count}건</b></div>`;
    html += d.emd.count ? d.emd.items.map(cardHTML).join("") : '<div class="empty" style="padding:16px">발생 없음</div>';
    // 같은 시군구
    html += `<div class="sec-label">같은 시·군·구 <b>${d.sigungu.count}건</b></div>`;
    html += d.sigungu.count ? d.sigungu.items.map(cardHTML).join("") : '<div class="empty" style="padding:16px">발생 없음</div>';
    el("areaBody").innerHTML = html;
  }catch(e){
    el("areaBody").innerHTML = '<div class="empty">정보를 불러오지 못했습니다.</div>';
  }
}

// ── 과거자료 ──────────────────────────
async function openHist(code, title){
  show("viewHist");
  el("histTitle").textContent = (title||"전국") + " · 과거자료";
  el("histBody").innerHTML = '<div class="loading">불러오는 중…</div>';
  try{
    const d = await api(code ? {mode:"history", code} : {mode:"history"});
    if(!d.ok) throw new Error(d.message);
    if(!d.byYear.length){ el("histBody").innerHTML='<div class="empty">발생 이력이 없습니다.</div>'; return; }
    let html = `<div class="sec-label">총 ${d.total.toLocaleString()}건 · 연도별</div>`;
    html += d.byYear.map(y=>{
      const dis = y.byDisease.slice(0,4).map(x=>`${x.name} ${x.count}`).join(" · ");
      return `<div class="yr"><div class="y">${y.year} <span style="color:var(--t3);font-size:13px;font-weight:400">${y.count}건</span></div><div class="d">${dis}</div></div>`;
    }).join("");
    el("histBody").innerHTML = html;
  }catch(e){
    el("histBody").innerHTML = '<div class="empty">정보를 불러오지 못했습니다.</div>';
  }
}
el("btnHistHome").addEventListener("click", ()=>openHist(null,"전국"));
el("btnAreaHist").addEventListener("click", ()=>{ if(curArea) openHist(curArea.code.slice(0,5), curArea.loc.split(" ").slice(0,2).join(" ")); });

// ── 전체보기(간단: 큰 limit로 재조회) ──
el("btnAll").addEventListener("click", async ()=>{
  el("homeList").innerHTML = '<div class="loading">불러오는 중…</div>';
  try{
    const d = await api({mode:"recent", days:curDays, limit:200});
    el("homeList").innerHTML = d.items.length ? d.items.map(cardHTML).join("") : '<div class="empty">발생 없음</div>';
    el("btnAll").textContent = `전체 ${d.summary.caseCount}건`;
  }catch(e){}
});

// ── 시작 ──────────────────────────────
loadHome();
</script>
</body>
</html>
