<!-- disease.html (v4) · 저장: 2026-08-27 06:31 KST · 청/질병/기간(년월) 필터 + 검색이 지도·목록 필터 + 카톡공유·이미지저장 + 핀 우선순위/반투명배지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>가축질병 현장정보</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --line:#e5e7eb; --line2:#d1d5db;
    --t1:#1f2937; --t2:#6b7280; --t3:#9ca3af;
    --accent:#1d6fe0; --accent-bg:#e8f1fd;
    --warn:#b45309; --warn-bg:#fef3e2;
    --red:#d64545; --red-bg:#fdecec;
    --amber:#e08b16; --purple:#7c3aed; --blue:#1d6fe0; --gray:#9ca3af;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--t1); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:16px; line-height:1.5; overflow-x:hidden;}
  .wrap{max-width:560px; margin:0 auto; padding:0 14px 40px;}
  header{position:sticky; top:0; z-index:10; background:var(--bg); padding:12px 0 8px; border-bottom:1px solid var(--line);}
  .h-top{display:flex; align-items:center; gap:10px;}
  .home-btn{background:none; border:none; color:var(--accent); font-size:14px; font-weight:700; padding:4px 0; flex:0 0 auto;}
  .h-title{font-size:19px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .h-time{font-size:12px; color:var(--t3); margin-top:2px;}
  .search-box{display:flex; gap:6px; margin-top:9px;}
  .search-box input{flex:1; height:44px; border:1px solid var(--line2); border-radius:12px; padding:0 14px; font-size:16px; background:var(--card); color:var(--t1);}
  .search-box button{width:50px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:19px; font-weight:600;}
  .rowscroll{display:flex; gap:6px; margin:9px 0 2px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
  .rowscroll::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; height:34px; padding:0 13px; border:1px solid var(--line2); background:var(--card); border-radius:20px; font-size:13.5px; color:var(--t2); white-space:nowrap;}
  .chip.on{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  .chip.cat.on{background:var(--t1); border-color:var(--t1);}
  .rangeBox{display:flex; align-items:center; gap:6px; margin:6px 0 2px; flex-wrap:wrap;}
  .rangeBox input{height:38px; border:1px solid var(--line2); border-radius:9px; padding:0 8px; font-size:14px; background:var(--card); color:var(--t1);}
  .rangeBox button{height:38px; padding:0 14px; border:none; border-radius:9px; background:var(--accent); color:#fff; font-size:14px; font-weight:600;}
  .share-row{display:flex; gap:8px; margin:9px 0 2px;}
  .share-row button{flex:1; height:42px; border:1px solid var(--line2); background:var(--card); border-radius:11px; font-size:14px; font-weight:600; color:var(--t1); display:flex; align-items:center; justify-content:center; gap:6px;}
  .share-row .kko{background:#FEE500; border-color:#FEE500; color:#3c1e1e;}
  .summary{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:11px 0;}
  .stat{background:var(--card); border-radius:12px; padding:12px 4px; text-align:center; border:1px solid var(--line);}
  .stat .n{font-size:24px; font-weight:700;}
  .stat .l{font-size:12px; color:var(--t2); margin-top:1px;}
  .sec-label{font-size:13px; color:var(--t2); margin:15px 2px 8px; font-weight:600;}
  .filter-tag{display:inline-block; font-size:12px; background:var(--accent-bg); color:var(--accent); border-radius:20px; padding:2px 10px; margin-left:6px; font-weight:600;}
  .card{background:var(--card); border:1px solid var(--line); border-left-width:4px; border-radius:10px; padding:11px 13px; margin-bottom:8px;}
  .card .loc{font-size:16px; font-weight:700; line-height:1.35;}
  .card .dis{font-size:14px; color:var(--accent); margin-top:2px; font-weight:600;}
  .card .meta{font-size:13px; color:var(--t2); margin-top:3px;}
  .card .meta .sep{color:var(--line2); margin:0 5px;}
  .btn-row{display:flex; gap:8px; margin-top:12px;}
  .btn{flex:1; text-align:center; padding:13px; border:1px solid var(--line2); background:var(--card); border-radius:12px; font-size:15px; font-weight:600; color:var(--t1);}
  .btn-more{width:100%; text-align:center; padding:13px; border:1px dashed var(--line2); background:transparent; border-radius:12px; font-size:14px; color:var(--t2); margin-top:4px;}
  .banner-none{background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:12px 14px; font-size:14px; font-weight:600; margin-bottom:10px;}
  .banner-ok{background:var(--red-bg); color:var(--red); border-radius:10px; padding:12px 14px; font-size:14px; font-weight:600; margin-bottom:10px;}
  .empty{text-align:center; color:var(--t3); padding:34px 12px; font-size:15px;}
  .loading{text-align:center; color:var(--t2); padding:26px; font-size:15px;}
  .hidden{display:none;}
  .subttl{font-size:15px; font-weight:700; margin:4px 0 10px; padding:11px 13px; background:var(--card); border:1px solid var(--line); border-radius:10px;}
  .note{font-size:12px; color:var(--t3); text-align:center; margin-top:18px; line-height:1.5;}
  /* 지도 */
  #mapWrap{margin:11px 0 4px;}
  #map{width:100%; height:340px; border-radius:12px; border:1px solid var(--line); background:#e9edf1;}
  .map-legend{display:flex; flex-wrap:wrap; gap:11px; justify-content:center; margin:8px 0 2px; font-size:12.5px; color:var(--t2);}
  .map-legend .lg{display:inline-flex; align-items:center; gap:5px;}
  .map-note{font-size:11.5px; color:var(--t3); text-align:center; margin-top:2px;}
  .mk-i{display:inline-block; width:12px; height:12px;}
  .mk-i.mk-asf{background:var(--red); border-radius:50%;}
  .mk-i.mk-etc{background:var(--gray); border-radius:50%;}
  .mk-i.mk-fmd{background:var(--purple); border-radius:2px; transform:rotate(45deg);}
  .mk-i.mk-lumpy{background:var(--blue); border-radius:50% 50% 50% 0; transform:rotate(45deg);}
  .mk-i.mk-ai{width:0; height:0; background:none; border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:12px solid var(--amber);}
  /* 마커 */
  .mk{position:relative; transform:translate(-50%,-50%);}
  .mk .sh{display:block; box-shadow:0 1px 3px rgba(0,0,0,.4);}
  .mk-asf .sh{width:20px; height:20px; background:var(--red); border-radius:50%;}
  .mk-etc .sh{width:15px; height:15px; background:var(--gray); border-radius:50%;}
  .mk-fmd .sh{width:18px; height:18px; background:var(--purple); border-radius:3px; transform:rotate(45deg);}
  .mk-lumpy .sh{width:18px; height:18px; background:var(--blue); border-radius:50% 50% 50% 0; transform:rotate(45deg);}
  .mk-ai .sh{width:0; height:0; background:none; border-left:11px solid transparent; border-right:11px solid transparent; border-bottom:19px solid var(--amber); box-shadow:none; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
  .mk .cnt{position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:rgba(20,20,22,.62); color:#fff; font-size:11px; font-weight:700; border-radius:10px; padding:0 6px; line-height:16px; min-width:16px; text-align:center; white-space:nowrap;}
  /* 과거자료 */
  .filters{display:flex; gap:8px; margin:2px 0 10px;}
  .filters select{flex:1; height:40px; border:1px solid var(--line2); border-radius:10px; background:var(--card); color:var(--t1); font-size:14px; padding:0 10px;}
  .yr{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .yr .y{font-size:16px; font-weight:700;}
  .yr .cnt2{font-size:13px; color:var(--t3); font-weight:400; margin-left:6px;}
  .yr .d{font-size:13.5px; color:var(--t2); margin-top:2px;}
  .chev{color:var(--t3);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="h-top">
      <button id="homeBtn" class="home-btn hidden">← 홈</button>
      <div class="h-title">🐾 가축질병 현장정보</div>
    </div>
    <div class="h-time" id="dataTime">데이터 확인 중…</div>
    <div class="search-box">
      <input id="q" type="search" inputmode="search" placeholder="방문지역 검색 (예: 경상북도, 나주)" autocomplete="off">
      <button id="btnSearch" aria-label="검색">🔍</button>
    </div>
  </header>

  <section id="viewHome">
    <!-- 청 선택 -->
    <div class="rowscroll" id="officeChips">
      <button class="chip on" data-off="전국">전국</button>
      <button class="chip" data-off="동북청">동북청</button>
      <button class="chip" data-off="동남청">동남청</button>
      <button class="chip" data-off="경인청">경인청</button>
      <button class="chip" data-off="충청청">충청청</button>
      <button class="chip" data-off="호남청">호남청</button>
    </div>
    <!-- 기간 -->
    <div class="rowscroll" id="period">
      <button class="chip" data-d="7">최근 7일</button>
      <button class="chip" data-d="30">1개월</button>
      <button class="chip on" data-d="90">3개월</button>
      <button class="chip" data-d="180">6개월</button>
      <button class="chip" data-d="365">1년</button>
      <button class="chip" id="btnRange">📅 기간설정</button>
    </div>
    <div class="rangeBox hidden" id="rangeBox">
      <input type="month" id="fromM"><span style="color:var(--t3)">~</span><input type="month" id="toM">
      <button id="applyRange">적용</button>
    </div>
    <!-- 질병 -->
    <div class="rowscroll" id="catChips">
      <button class="chip cat on" data-cat="">전체</button>
      <button class="chip cat" data-cat="asf">ASF</button>
      <button class="chip cat" data-cat="ai">AI</button>
      <button class="chip cat" data-cat="fmd">FMD</button>
      <button class="chip cat" data-cat="lumpy">럼피스킨</button>
      <button class="chip cat" data-cat="etc">기타</button>
    </div>
    <!-- 공유 -->
    <div class="share-row">
      <button class="kko" id="btnKakao">💬 카카오톡 공유</button>
      <button id="btnImg">🖼 이미지 저장</button>
    </div>

    <div class="summary">
      <div class="stat"><div class="n" id="sRegion">–</div><div class="l">발생지역</div></div>
      <div class="stat"><div class="n" id="sCase">–</div><div class="l">발생건수</div></div>
      <div class="stat"><div class="n" id="s7">–</div><div class="l">최근 7일</div></div>
    </div>

    <div id="mapWrap">
      <div id="map"></div>
      <div class="map-legend">
        <span class="lg"><i class="mk-i mk-asf"></i>ASF</span>
        <span class="lg"><i class="mk-i mk-ai"></i>AI</span>
        <span class="lg"><i class="mk-i mk-fmd"></i>FMD</span>
        <span class="lg"><i class="mk-i mk-lumpy"></i>럼피스킨</span>
        <span class="lg"><i class="mk-i mk-etc"></i>기타</span>
      </div>
      <div class="map-note">핀의 숫자는 발생건수, 색·모양은 대표 질병(ASF›AI›FMD›럼피스킨›기타 순)입니다. 위치는 실제 농가가 아닌 행정구역(시·군) 중심점 기준.</div>
    </div>

    <div class="sec-label" id="homeLabel">발생 목록 · 최신순</div>
    <div id="homeList"></div>
    <div class="btn-row">
      <button class="btn" id="btnHistHome">전국 과거자료</button>
    </div>
    <div class="note">본 정보는 농림축산검역본부 공개데이터 기준이며 방역 판단 자료가 아닙니다. 최종 방문 여부는 소속기관 지침에 따르세요.</div>
  </section>

  <section id="viewArea" class="hidden">
    <div class="subttl" id="areaTitle"></div>
    <div id="areaBody"></div>
    <button class="btn-more" id="btnAreaHist">이 지역 과거자료 보기</button>
  </section>

  <section id="viewHist" class="hidden">
    <div class="subttl" id="histTitle"></div>
    <div id="histBody"></div>
  </section>

</div>

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d7a99b2a71a456ad75815e664f3dda20&libraries=services&autoload=false"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const RELAY = "https://induowdrembd3zhtym3ke6prcy0cgajf.lambda-url.ap-northeast-2.on.aws/";
const KAKAO_KEY = "d7a99b2a71a456ad75815e664f3dda20";
const SITE = "https://ubaldos00-ship-it.github.io/home/disease.html";
const SIDO_FULL = {"서울":"서울특별시","부산":"부산광역시","대구":"대구광역시","인천":"인천광역시","광주":"광주광역시","대전":"대전광역시","울산":"울산광역시","세종":"세종특별자치시","경기":"경기도","강원":"강원특별자치도","충북":"충청북도","충남":"충청남도","전북":"전북특별자치도","전남":"전라남도","경북":"경상북도","경남":"경상남도","제주":"제주특별자치도"};
const OFFICE = {"전국":null,"동북청":["대구","경북","강원"],"동남청":["부산","울산","경남"],"경인청":["서울","인천","경기"],"충청청":["대전","세종","충남","충북"],"호남청":["전북","전남","광주","제주"]};
const CAT_ORDER = ["asf","ai","fmd","lumpy","etc"];

let allItems=[];          // 현재 기간 전체
let curDays=90, curFrom="", curTo="", periodLabel="최근 3개월";
let curOffice="전국", curCat="", curQ="";
let lastSummary={regionCount:0,caseCount:0,last7d:0,periodLabel:"최근 3개월"};
let _map=null,_geocoder=null,_places=null,_overlays=[];

function el(id){return document.getElementById(id);}
function show(view){
  ["viewHome","viewArea","viewHist"].forEach(v=>el(v).classList.add("hidden"));
  el(view).classList.remove("hidden");
  el("homeBtn").classList.toggle("hidden", view==="viewHome");
  window.scrollTo(0,0);
  if(view==="viewHome" && _map){ setTimeout(()=>{ try{_map.relayout();}catch(e){} },30); }
}
function goHome(){ show("viewHome"); }
el("homeBtn").addEventListener("click", goHome);

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtOcc(s){ if(!s||s.length<8) return s||""; return s.slice(2,4)+"."+s.slice(4,6)+"."+s.slice(6,8); }
function fmtCess(s){ if(!s||s.length<8) return "종식일 미등록"; return "종식 "+s.slice(2,4)+"."+s.slice(4,6)+"."+s.slice(6,8); }
function fmtTime(iso){ try{ const k=new Date(new Date(iso).getTime()+9*3600000); const p=n=>String(n).padStart(2,"0"); return p(k.getUTCMonth()+1)+"."+p(k.getUTCDate())+" "+p(k.getUTCHours())+":"+p(k.getUTCMinutes()); }catch(e){ return ""; } }
function ymdDaysAgo(days){ const d=new Date(Date.now()-days*86400000); const p=n=>String(n).padStart(2,"0"); return ""+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()); }
function diseaseCat(dis){ if(/아프리카|ASF/.test(dis))return"asf"; if(/고병원성|조류인플루엔자/.test(dis))return"ai"; if(/구제역/.test(dis))return"fmd"; if(/럼피/.test(dis))return"lumpy"; return"etc"; }
function levelsFromLoc(loc){
  const t=(loc||"").trim().split(/\s+/);
  const sgg=[t[0]||""]; let i=1;
  for(; i<t.length; i++){ sgg.push(t[i]); if(/[시군]$/.test(t[i])){ if(t[i+1]&&/구$/.test(t[i+1])){ sgg.push(t[i+1]); i++; } i++; break; } if(/구$/.test(t[i])){ i++; break; } }
  const sggKey=sgg.join(" ");
  return { sgg:sggKey, emd:(i<t.length?sggKey+" "+t[i]:sggKey), ri:t.join(" ") };
}
function sgg2FromSgg(sgg){ const t=sgg.split(" "); return t.length>=3?t.slice(0,2).join(" "):sgg; }
function catColor(c){ return {asf:"var(--red)",ai:"var(--amber)",fmd:"var(--purple)",lumpy:"var(--blue)",etc:"var(--gray)"}[c]||"var(--gray)"; }
function cardHTML(x){
  const lv=levelsFromLoc(x.loc);
  return `<div class="card" data-sgg="${esc(lv.sgg)}" data-emd="${esc(lv.emd)}" data-ri="${esc(lv.ri)}" data-title="${esc(x.loc)}" style="border-left-color:${catColor(diseaseCat(x.disease))}">
    <div class="loc">${esc(x.loc)||"-"}</div>
    <div class="dis">${esc(x.disease)||"-"} · ${esc(x.species)||"-"}</div>
    <div class="meta">${fmtOcc(x.occDe)} 발생<span class="sep">|</span>${x.count?Number(x.count).toLocaleString()+"마리":"두수 미상"}<span class="sep">|</span>${fmtCess(x.cessDe)}</div>
  </div>`;
}
async function api(params){ const res=await fetch(RELAY+"?"+new URLSearchParams(params).toString()); if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); }

/* ── 기간 데이터 로드 ── */
async function fetchPeriod(){
  el("homeList").innerHTML='<div class="loading">불러오는 중…</div>';
  try{
    const p={mode:"recent", limit:100000};
    if(curFrom||curTo){ if(curFrom)p.from=curFrom; if(curTo)p.to=curTo; } else p.days=curDays;
    const d=await api(p);
    if(!d.ok) throw new Error(d.message);
    el("dataTime").textContent="데이터 확인 "+fmtTime(d.fetchedAt);
    allItems=d.items||[];
    applyFilters();
  }catch(e){
    allItems=[];
    el("homeList").innerHTML='<div class="empty">현재 가축질병 정보를 불러오지<br>못했습니다. 잠시 후 다시 확인해 주세요.</div>';
    el("dataTime").textContent="데이터 확인 실패";
  }
}

/* ── 필터 적용 (즉시) ── */
function currentView(){
  const offSet=OFFICE[curOffice];
  return allItems.filter(x=>{
    if(offSet){ const sido=(x.loc||"").split(" ")[0]; if(!offSet.includes(sido)) return false; }
    if(curCat && diseaseCat(x.disease)!==curCat) return false;
    if(curQ && !(x.loc||"").includes(curQ)) return false;
    return true;
  });
}
function applyFilters(){
  const v=currentView();
  // 요약
  const emdSet=new Set(v.map(x=>levelsFromLoc(x.loc).emd));
  const cut7=ymdDaysAgo(7);
  const last7=v.filter(x=>x.occDe>=cut7).length;
  el("sRegion").textContent=emdSet.size;
  el("sCase").textContent=v.length;
  el("s7").textContent=last7;
  lastSummary={regionCount:emdSet.size, caseCount:v.length, last7d:last7, periodLabel};
  // 라벨
  let tag="";
  if(curOffice!=="전국") tag+=` <span class="filter-tag">${curOffice}</span>`;
  if(curQ) tag+=` <span class="filter-tag">검색: ${esc(curQ)}</span>`;
  if(curCat) tag+=` <span class="filter-tag">${ {asf:"ASF",ai:"AI",fmd:"FMD",lumpy:"럼피스킨",etc:"기타"}[curCat] }</span>`;
  el("homeLabel").innerHTML=`${periodLabel} 발생 목록 · 최신순${tag}`;
  // 목록
  el("homeList").innerHTML = v.length ? v.slice(0,200).map(cardHTML).join("") : '<div class="empty">조건에 맞는 발생이 없습니다.</div>';
  // 지도
  renderPins(v);
}

/* ── 지도 핀 ── */
function geoQuery(sgg){ const t=(sgg||"").split(" "); if(t.length&&SIDO_FULL[t[0]]) t[0]=SIDO_FULL[t[0]]; return t.join(" "); }
function geocode(sgg){
  return new Promise(res=>{
    const ck="geo:"+sgg;
    try{ const c=localStorage.getItem(ck); if(c){ const a=c.split(","); return res([+a[0],+a[1]]); } }catch(e){}
    const qy=geoQuery(sgg);
    _geocoder.addressSearch(qy,(r,st)=>{
      if(st===kakao.maps.services.Status.OK && r[0]){ const la=+r[0].y,ln=+r[0].x; try{localStorage.setItem(ck,la+","+ln);}catch(e){} return res([la,ln]); }
      _places.keywordSearch(qy,(r2,st2)=>{
        if(st2===kakao.maps.services.Status.OK && r2[0]){ const la=+r2[0].y,ln=+r2[0].x; try{localStorage.setItem(ck,la+","+ln);}catch(e){} return res([la,ln]); }
        res(null);
      });
    });
  });
}
function clearOverlays(){ _overlays.forEach(o=>o.setMap(null)); _overlays=[]; }
let _pinToken=0;
async function renderPins(items){
  if(!_map||!_geocoder) return;
  const token=++_pinToken;
  const m=new Map();
  for(const x of (items||[])){
    const k=sgg2FromSgg(levelsFromLoc(x.loc).sgg);
    if(!m.has(k)) m.set(k,{sgg:k,asf:0,ai:0,fmd:0,lumpy:0,etc:0,total:0});
    const o=m.get(k); o[diseaseCat(x.disease)]++; o.total++;
  }
  const arr=[...m.values()];
  const coords=await Promise.all(arr.map(p=>geocode(p.sgg)));
  if(token!==_pinToken) return; // 이후 필터로 갱신됨 → 폐기
  clearOverlays();
  arr.forEach((p,idx)=>{
    const c=coords[idx]; if(!c) return;
    let cat="etc"; for(const cc of CAT_ORDER){ if(p[cc]>0){ cat=cc; break; } }
    const d=document.createElement("div");
    d.className="mk mk-"+cat;
    d.innerHTML=`<span class="sh"></span><span class="cnt">${p.total}</span>`;
    d.onclick=()=>openArea({sgg:p.sgg,emd:"",ri:"",title:p.sgg});
    const ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(c[0],c[1]),content:d,yAnchor:0.5,xAnchor:0.5,clickable:true});
    ov.setMap(_map); _overlays.push(ov);
  });
}

el("btnRange").addEventListener("click",()=>{ el("rangeBox").classList.toggle("hidden"); });
el("applyRange").addEventListener("click",()=>{
  const f=el("fromM").value, t=el("toM").value;

  el("btnRange").classList.add("on");
  periodLabel=(f?f:"~")+" ~ "+(t?t:"~");

});

/* ── 공유 ── */

    Kakao.Share.sendDefault({ objectType:"text",
      text:`🐾 가축질병 현장정보\n[${curOffice}] ${s.periodLabel}\n발생지역 ${s.regionCount} · 발생 ${s.caseCount}건 · 최근7일 ${s.last7d}`,

async function renderCanvas(ignoreMap){ return html2canvas(el("viewHome"),{useCORS:true,backgroundColor:"#f4f5f7",scale:2,ignoreElements:ignoreMap?(n=>n.id==="map"):undefined}); }
el("btnImg").addEventListener("click",async()=>{

let curArea=null;
async function openArea(scope){
  curArea=scope; show("viewArea");
  el("areaTitle").textContent=scope.title;
  el("areaBody").innerHTML='<div class="loading">불러오는 중…</div>';
  try{
    const p={mode:"area", sgg:scope.sgg, days:(curFrom||curTo)?365:curDays};
    if(scope.emd) p.emd=scope.emd; if(scope.ri) p.ri=scope.ri;
    const d=await api(p); if(!d.ok) throw new Error(d.message);
    let html="";
    if(scope.ri){
      html += d.ri.count>0 ? `<div class="banner-ok">해당 리 · 최근 발생 ${d.ri.count}건</div>`+d.ri.items.map(cardHTML).join("") : `<div class="banner-none">해당 리 · 최근 발생 없음</div>`;
      html += `<div class="sec-label">같은 읍·면·동 <b>${d.emd.count}건</b></div>`;
      html += d.emd.count ? d.emd.items.map(cardHTML).join("") : '<div class="empty" style="padding:16px">발생 없음</div>';
    }
    html += `<div class="sec-label">${scope.ri?"같은 ":""}시·군·구 <b>${d.sigungu.count}건</b></div>`;
    html += d.sigungu.count ? d.sigungu.items.map(cardHTML).join("") : '<div class="empty" style="padding:16px">해당 기간 발생 없음</div>';
    el("areaBody").innerHTML=html;
  }catch(e){ el("areaBody").innerHTML='<div class="empty">정보를 불러오지 못했습니다.</div>'; }
}

/* ── 과거자료 ── */
let histScope=null, histFilter={disease:"",species:""};
function openHist(scope){ histScope=scope; histFilter={disease:"",species:""}; loadHist(); }
async function loadHist(){
  show("viewHist");
  el("histTitle").textContent=(histScope.title||"전국")+" · 과거자료";
  el("histBody").innerHTML='<div class="loading">불러오는 중…</div>';
  try{
    const p={mode:"history"};
    if(histScope.sgg) p.sgg=histScope.sgg; if(histScope.emd) p.emd=histScope.emd; if(histScope.ri) p.ri=histScope.ri;
    if(histFilter.disease) p.disease=histFilter.disease; if(histFilter.species) p.species=histFilter.species;
    const d=await api(p); if(!d.ok) throw new Error(d.message);
    const dOpt=`<option value="">질병 전체</option>`+d.diseases.map(x=>`<option ${x===histFilter.disease?"selected":""}>${esc(x)}</option>`).join("");
    const sOpt=`<option value="">축종 전체</option>`+d.speciesList.map(x=>`<option ${x===histFilter.species?"selected":""}>${esc(x)}</option>`).join("");
    let html=`<div class="filters"><select id="fDisease">${dOpt}</select><select id="fSpecies">${sOpt}</select></div>`;
    html+=`<div class="sec-label">총 ${Number(d.total).toLocaleString()}건 · 연도를 누르면 개별기록</div>`;
    html+= d.byYear.length ? d.byYear.map(y=>{ const dis=y.byDisease.slice(0,4).map(x=>`${esc(x.name)} ${x.count}`).join(" · "); return `<div class="yr" data-year="${y.year}"><div><div class="y">${y.year}<span class="cnt2">${y.count}건</span></div><div class="d">${dis}</div></div><span class="chev">›</span></div>`; }).join("") : '<div class="empty">해당 조건의 발생 이력이 없습니다.</div>';
    el("histBody").innerHTML=html;
    el("fDisease").onchange=e=>{ histFilter.disease=e.target.value; loadHist(); };
    el("fSpecies").onchange=e=>{ histFilter.species=e.target.value; loadHist(); };
    el("histBody").querySelectorAll(".yr").forEach(r=>{ r.onclick=()=>openYear(r.dataset.year); });
  }catch(e){ el("histBody").innerHTML='<div class="empty">정보를 불러오지 못했습니다.</div>'; }
}
async function openYear(year){
  el("histBody").innerHTML='<div class="loading">불러오는 중…</div>';
  try{
    const p={mode:"history", from:year+"0101", to:year+"1231"};
    if(histScope.sgg) p.sgg=histScope.sgg; if(histScope.emd) p.emd=histScope.emd; if(histScope.ri) p.ri=histScope.ri;
    if(histFilter.disease) p.disease=histFilter.disease; if(histFilter.species) p.species=histFilter.species;
    const d=await api(p);
    let html=`<button class="btn-more" id="backYear" style="margin-bottom:10px">← 연도별로</button>`;
    html+=`<div class="sec-label">${esc(histScope.title||"전국")} · ${year} · ${Number(d.total).toLocaleString()}건</div>`;
    html+= d.items.length ? d.items.map(cardHTML).join("") : '<div class="empty">기록 없음</div>';
    el("histBody").innerHTML=html;
    el("backYear").onclick=loadHist;
  }catch(e){ el("histBody").innerHTML='<div class="empty">정보를 불러오지 못했습니다.</div>'; }
}

}
